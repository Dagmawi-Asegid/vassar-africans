<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />

  <!-- kente-inspired dashed accent ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="2.6 3.4" opacity="0.55" />

  <!-- monogram -->
  <text x="50" y="61" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#gold)">VA</text>

  <!-- sankofa-inspired heritage curl -->
  <path d="M33 74 q7 6 17 6 q10 0 17 -6" fill="none" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>
