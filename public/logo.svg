<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vassar Africans logo">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A3"/>
      <stop offset="45%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#F5A300"/>
    </linearGradient>
    <radialGradient id="sky" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#243049"/>
      <stop offset="60%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#0A0E18"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4C4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FFD23F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFD23F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#sky)"/>

  <g clip-path="url(#disc)">
    <!-- warm sunrise glow behind the continent -->
    <circle cx="256" cy="286" r="210" fill="url(#sunGlow)"/>

    <!-- rising sun rays -->
    <g stroke="url(#gold)" stroke-width="10" stroke-linecap="round" opacity="0.9">
      <line x1="256" y1="70" x2="256" y2="34"/>
      <line x1="152" y1="98" x2="132" y2="66"/>
      <line x1="360" y1="98" x2="380" y2="66"/>
      <line x1="90" y1="176" x2="56" y2="158"/>
      <line x1="422" y1="176" x2="456" y2="158"/>
    </g>

    <!-- outer ring -->
    <circle cx="256" cy="256" r="234" fill="none" stroke="url(#gold)" stroke-width="12"/>

    <!-- stylized African continent -->
    <path fill="url(#gold)" d="M150 118 L262 96 L342 108 L360 150 Q372 168 400 182 L446 214 Q462 226 452 244 L420 262 Q404 272 402 300 L392 340 Q384 366 360 392 L336 430 Q322 460 300 476 Q288 484 278 470 L258 420 Q248 392 244 360 Q214 356 196 332 Q182 314 176 300 L150 300 Q120 292 110 256 Q102 226 118 196 L132 150 Q138 128 150 118 Z"/>

    <!-- sparks -->
    <g fill="#FFF6D0" stroke="none">
      <path d="M372 150 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z"/>
      <path d="M138 348 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z"/>
      <path d="M330 360 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z"/>
    </g>
  </g>
</svg>
